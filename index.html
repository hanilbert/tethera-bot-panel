<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tethera 面板</title>
<!-- Telegram Mini App 官方脚本。页面本身不含数据：当前状态由机器人放在网址 ?s= 里（Telegram 会占用 # 后面传它自己的参数），
     点「保存」后由 Telegram 把选择作为私聊消息交回机器人，机器人核对是不是韩本人再改。 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127,127,127,.16);
    --ok: #30a46c; --ok-bg: rgba(48,164,108,.13);
    --warn: #e5484d; --warn-bg: rgba(229,72,77,.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; padding: 20px 16px 28px; color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; margin: 0 4px 20px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 24px;
          background: linear-gradient(135deg, #5b8def, #8a5cf6); color: #fff; flex: none; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  header p { margin: 2px 0 0; color: var(--hint); font-size: 13px; }

  .section-title { margin: 0 16px 8px; font-size: 13px; color: var(--hint); font-weight: 600; letter-spacing: .3px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 22px;
          box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 62px; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.static { cursor: default; }
  .radio { width: 24px; height: 24px; border-radius: 50%; flex: none; border: 2px solid var(--line); transition: all .15s;
           display: grid; place-items: center; }
  .row.on .radio { border-color: var(--accent); background: var(--accent); }
  .row.on .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-text); }
  .icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none;
          font-weight: 700; font-size: 15px; color: #fff; }
  .i-claude { background: #d97757; } .i-agy { background: #4c8bf5; }
  .i-codex { background: #111; } .i-omp { background: #7c5cff; }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 16px; font-weight: 500; }
  .sub { font-size: 12.5px; color: var(--hint); margin-top: 1px; }
  .row.on .sub { color: var(--accent); }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: none; font-weight: 500; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.bad { color: var(--warn); background: var(--warn-bg); }

  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 30px; background: var(--line); transition: .2s; cursor: pointer; }
  .switch i::after { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; border-radius: 50%;
                     background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .2s; }
  .switch input:checked + i { background: var(--ok); }
  .switch input:checked + i::after { transform: translateX(20px); }

  .foot { color: var(--hint); font-size: 12.5px; margin: -12px 16px 22px; line-height: 1.5; }
  #outside { display: none; text-align: center; color: var(--hint); margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div class="logo">🤖</div>
  <div><h1>用哪个 agent</h1><p>选谁就只用谁，到限额就等着，不会自动换</p></div>
</header>

<div class="section-title">写代码</div>
<div class="card" id="writers"></div>

<div class="section-title">审查</div>
<div class="card" id="reviewers"></div>

<div class="section-title">发版</div>
<div class="card" id="releasers"></div>
<div class="foot">发版本身是程序在跑，只有卡住时修、CI 跑完后收尾才用这个 agent。</div>

<div class="section-title">额度冷却</div>
<div class="card">
  <div class="row static">
    <div class="meta"><div class="name">清掉冷却，马上重试</div><div class="sub">报过额度不够的 agent 会先歇一会儿</div></div>
    <label class="switch"><input type="checkbox" id="clear"><i></i></label>
  </div>
</div>

<p id="outside">请从 Telegram 里机器人的「打开面板」按钮进来。</p>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var NAMES = { claude: "Claude Code", agy: "反重力", codex: "Codex", omp: "omp" };
  var ICONS = { claude: "C", agy: "反", codex: "▲", omp: "π" };
  var WRITERS = ["claude", "agy", "omp"], REVIEWERS = ["codex", "omp"], RELEASERS = ["claude", "agy", "omp"];
  var state = {};
  try { state = JSON.parse(new URLSearchParams(location.search).get("s") || "{}") || {}; } catch (e) { state = {}; }
  var initial = {
    writer: WRITERS.indexOf(state.writer) >= 0 ? state.writer : "claude",
    reviewer: REVIEWERS.indexOf(state.reviewer) >= 0 ? state.reviewer : "codex",
    releaser: RELEASERS.indexOf(state.releaser) >= 0 ? state.releaser : "claude"
  };
  var cur = { writer: initial.writer, reviewer: initial.reviewer, releaser: initial.releaser, clear: false };

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pill(engine) {
    var s = state[engine];
    return s ? '<span class="pill bad">' + esc(s) + "</span>" : '<span class="pill ok">可用</span>';
  }
  function rows(list, picked, group) {
    return list.map(function (e) {
      var on = e === picked;
      return '<div class="row' + (on ? " on" : "") + '" data-group="' + group + '" data-engine="' + e + '">' +
        '<span class="radio"></span><span class="icon i-' + e + '">' + ICONS[e] + "</span>" +
        '<div class="meta"><div class="name">' + NAMES[e] + '</div><div class="sub">' + (on ? "在用" : "点一下改用它") + "</div></div>" +
        pill(e) + "</div>";
    }).join("");
  }
  function render() {
    document.getElementById("writers").innerHTML = rows(WRITERS, cur.writer, "writer");
    document.getElementById("reviewers").innerHTML = rows(REVIEWERS, cur.reviewer, "reviewer");
    document.getElementById("releasers").innerHTML = rows(RELEASERS, cur.releaser, "releaser");
    document.querySelectorAll("[data-engine]").forEach(function (el) {
      el.addEventListener("click", function () {
        cur[el.getAttribute("data-group")] = el.getAttribute("data-engine");
        haptic(); render();
      });
    });
    refresh();
  }
  function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  function changed() { return cur.writer !== initial.writer || cur.reviewer !== initial.reviewer || cur.releaser !== initial.releaser || cur.clear; }
  function refresh() { if (!tg || !tg.MainButton) return; changed() ? tg.MainButton.show() : tg.MainButton.hide(); }

  document.getElementById("clear").addEventListener("change", function (ev) { cur.clear = ev.target.checked; haptic(); refresh(); });

  var inTelegram = tg && tg.platform && tg.platform !== "unknown";
  if (inTelegram) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
    tg.MainButton.setText("保存");
    tg.MainButton.onClick(function () {
      tg.sendData(JSON.stringify({ first: cur.writer, reviewer: cur.reviewer, releaser: cur.releaser, clear: cur.clear }));
    });
  } else if (!location.search) {
    document.getElementById("outside").style.display = "block";
  }
  render();
})();
</script>
</body>
</html>
